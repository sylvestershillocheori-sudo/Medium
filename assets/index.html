<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header">

        <a class="medium" href="#">Medium</a>

        <div class="header-right">

            <!-- Menu button -->


            <!-- Navigation -->
            <nav class="nav-menu">
                <a href="#">Our Story</a>
                <a href="#">Membership</a>
                <a href="#">Write</a>
                <a href="#">Sign in</a>
            </nav>
            <button class="menu-toggle" aria-label="Open navigation">
                ☰
            </button>

            <button class="button">Get started</button>


        </div>

    </header>
    <section class="hero-section">

        <div class="rub"></div>

        <div class="hero-left">
            Human<br>
            Stories & Ideas
        </div>

        <p class="p">
            A place to read, write and deepen your understanding
        </p>

        <button class="btn">Start reading</button>

        <div class="hero-image">
            <img src="img/4_SdjkdS98aKH76I8eD0_qjw.webp" alt="Medium illustration">
        </div>

    </section>

    <footer>
        <div class="footer">
            <a class="help" href="#">Help</a>
            <a class="status" href="#">Status</a><span></span>
            <a class="about" href="#">About</a><span></span>
            <a class="career" href="#">Career</a><span></span>
            <a class="press" href="#">Press</a><span></span>
            <a class="blog" href="#">Blog</a><span></span>
            <a class="privacy" href="#">Privacy</a><span></span>
            <a class="rules" href="#">Rules</a>
            <a class="terms" href="#">Terms</a>
            <a class="text" href="#">Text to speech</a>
        </div>
    </footer>



<script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navMenu = document.querySelector(".nav-menu");

    menuToggle.addEventListener("click", () => {
        navMenu.classList.toggle("active");
    });
</script>



</body>

</html>
